
<style>
  .wrap { padding: 1.5rem 0; font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
  .field.compact { flex: 0 1 140px; min-width: 120px; }
  .field.checkbox { flex: 0 1 180px; min-width: 160px; justify-content: flex-end; }
  .field.overrides { flex-basis: 100%; }
  label { font-size: 13px; color: var(--color-text-secondary); }
  .check-label { display: flex; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
  textarea { min-height: 6rem; resize: vertical; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .btn { padding: 7px 18px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; font-size: 14px; color: var(--color-text-primary); }
  .btn:hover { background: var(--color-background-secondary); }
  .btn.on { background: #cc0000; color: white; border-color: #cc0000; }
  h3 { font-size: 15px; font-weight: 500; margin: 0 0 0.75rem; color: var(--color-text-primary); }
  .canvas-wrap { position: relative; display: inline-block; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; background: #fff; }
  #filterOverlay { display: none; position: absolute; inset: 0; background: hsl(0,100%,50%); mix-blend-mode: multiply; pointer-events: none; }
  #filterOverlay.on { display: block; }
</style>

<div class="wrap">
  <h2 class="sr-only">16-segment hidden message encoder</h2>
  <h3>Hidden message encoder</h3>
  <div class="row">
    <div class="field">
      <label>Secret message</label>
      <textarea id="secret" rows="4" maxlength="160">Hello, World!
0123456789
ASCII 16-seg: ?!@#$%
</textarea>
      <span class="hint">Printable ASCII characters plus line breaks</span>
    </div>
    <div class="field">
      <label>Decoy style</label>
      <select id="decoy">
        <option value="none">No decoy (test mode)</option>
        <option value="full">Full-segment noise</option>
        <option value="random" selected>Random characters</option>
        <option value="keyboard">Keyboard-row noise</option>
      </select>
    </div>
    <div class="field overrides">
      <label>Overrides</label>
      <textarea id="overrides" rows="4" spellcheck="false" placeholder="AB,,BC,,,,
,U,,,,,"></textarea>
      <span class="hint">Comma-separated cells and newline-separated rows. Click segments in override mode to edit visually.</span>
    </div>
  </div>
  <div class="row">
    <div class="field compact">
      <label for="charHeight">Height (pixels)</label>
      <input type="number" id="charHeight" min="24" max="240" step="1" value="72">
    </div>
    <div class="field compact">
      <label for="charWidth">Width (pixels)</label>
      <input type="number" id="charWidth" min="16" max="200" step="1" value="44">
    </div>
    <div class="field compact">
      <label for="hSpacing">Horizontal spacing (pixels)</label>
      <input type="number" id="hSpacing" min="0" max="120" step="1" value="12">
    </div>
    <div class="field compact">
      <label for="vSpacing">Vertical spacing (pixels)</label>
      <input type="number" id="vSpacing" min="0" max="120" step="1" value="16">
    </div>
    <div class="field compact">
      <label for="lineThickness">Line thickness (pixels)</label>
      <input type="number" id="lineThickness" min="2" max="48" step="1" value="6">
    </div>
    <div class="field checkbox">
      <label class="check-label" for="capsOnly">
        <input type="checkbox" id="capsOnly">
        <span>Caps only mode</span>
      </label>
    </div>
    <div class="field checkbox">
      <label class="check-label" for="overrideMode">
        <input type="checkbox" id="overrideMode">
        <span>Override click mode</span>
      </label>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="genBtn">Generate</button>
    <button class="btn" id="filtBtn">Toggle red filter</button>
    <button class="btn" id="dlBtn">Download PNG</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="filterOverlay"></div>
  </div>
</div>

<script>
const STORAGE_KEY_MESSAGE = 'red-reveal-message.secret';
const STORAGE_KEY_OVERRIDES = 'red-reveal-message.overrides';
const SEGMENTS = ['A','B','C','D','E','F','G','H','K','M','N','P','R','S','T','U'];
const FULL_MASK = SEGMENTS.slice();

// Source-backed printable ASCII masks from:
// https://github.com/dmadison/LED-Segment-ASCII
// File: 16-Segment/16-Segment-ASCII_HEX.txt
// Bit order in the repo is A, B, C, D, E, F, G, H, K, M, N, P, R, S, T, U, DP.
const ASCII_START = 32;
const ASCII_MASKS = [
  0x00000, 0x1000C, 0x00204, 0x0AA3C, 0x0AABB, 0x0EE99, 0x09371, 0x00200,
  0x01400, 0x04100, 0x0FF00, 0x0AA00, 0x04000, 0x08800, 0x10000, 0x04400,
  0x044FF, 0x0040C, 0x08877, 0x0083F, 0x0888C, 0x090B3, 0x088FB, 0x0000F,
  0x088FF, 0x088BF, 0x02200, 0x04200, 0x09400, 0x08830, 0x04900, 0x12807,
  0x00AF7, 0x088CF, 0x02A3F, 0x000F3, 0x0223F, 0x080F3, 0x080C3, 0x008FB,
  0x088CC, 0x02233, 0x0007C, 0x094C0, 0x000F0, 0x005CC, 0x011CC, 0x000FF,
  0x088C7, 0x010FF, 0x098C7, 0x088BB, 0x02203, 0x000FC, 0x044C0, 0x050CC,
  0x05500, 0x088BC, 0x04433, 0x02212, 0x01100, 0x02221, 0x05000, 0x00030,
  0x00100, 0x0A070, 0x0A0E0, 0x08060, 0x0281C, 0x0C060, 0x0AA02, 0x0A2A1,
  0x0A0C0, 0x02000, 0x02260, 0x03600, 0x000C0, 0x0A848, 0x0A040, 0x0A060,
  0x082C1, 0x0A281, 0x08040, 0x0A0A1, 0x080E0, 0x02060, 0x04040, 0x05048,
  0x05500, 0x00A1C, 0x0C020, 0x0A212, 0x02200, 0x02A21, 0x0CC00, 0x00000
];

const CHAR_MASKS = Object.fromEntries(
  ASCII_MASKS.map((mask, index) => [String.fromCharCode(ASCII_START + index), mask])
);

function maskToSegments(mask){
  return SEGMENTS.filter((_, i) => mask & (1 << i));
}

const S = Object.fromEntries(
  Object.entries(CHAR_MASKS).map(([ch, mask]) => [ch, maskToSegments(mask)])
);

const POOL = Object.keys(CHAR_MASKS).filter(ch => ch !== ' ');
const CAPS_POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const KROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function rgbWithMinSum(r, g, b, minSum){
  let rr = r;
  let gg = g;
  let bb = b;

  while (rr + gg + bb < minSum) {
    if (gg <= bb && gg < 255) gg++;
    else if (bb < 255) bb++;
    else if (rr < 255) rr++;
    else break;
  }

  return `rgb(${rr},${gg},${bb})`;
}

// Hidden-message segments must survive the red filter as dark/visible marks.
// A red filter removes cyan/blue-green light, so colors with R=0 collapse toward
// black against the red-tinted white background and become readable.
function hiddenMessageColor() {
  const g = randInt(80, 255);
  const b = randInt(80, 255);
  return rgbWithMinSum(0, g, b, 200);
}

// Decoy segments should blend into the red-tinted paper when the filter is on.
// Keeping R high means they stay red after filtering and visually disappear into
// the background rather than turning dark.
function decoyCoverColor() {
  const r = randInt(200, 255);
  const g = randInt(0, 80);
  const b = randInt(0, 80);
  return rgbWithMinSum(r, g, b, 200);
}

function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

function isCapsOnlyMode(){
  return document.getElementById('capsOnly').checked;
}

function getDecoyPool(){
  return isCapsOnlyMode() ? CAPS_POOL : POOL;
}

function pickDecoy(mode, secretChar){
  if(mode==='none')     return ' ';
  if(mode==='full')     return '*';
  if(mode==='keyboard') return rnd(rnd(KROWS));
  const pool = getDecoyPool();
  let c;
  do { c = rnd(pool); } while(c===secretChar && pool.length > 1);
  return c;
}

const PAD = 12;

function clampNumber(value, min, max, fallback){
  const num = Number.parseInt(value, 10);
  if (Number.isNaN(num)) return fallback;
  return Math.min(max, Math.max(min, num));
}

function getMetrics(){
  const width = clampNumber(document.getElementById('charWidth').value, 16, 200, 44);
  const height = clampNumber(document.getElementById('charHeight').value, 24, 240, 72);
  const hSpacing = clampNumber(document.getElementById('hSpacing').value, 0, 120, 12);
  const vSpacing = clampNumber(document.getElementById('vSpacing').value, 0, 120, 16);
  const thickness = clampNumber(document.getElementById('lineThickness').value, 2, 48, 6);

  // Keep segment thickness and internal gaps proportional so the glyph layout
  // stays stable as the user changes width and height independently.
  const centerGap = Math.max(2, Math.round(thickness * 0.67));
  const cellWidth = width + hSpacing;
  const cellHeight = height + vSpacing;

  return { width, height, hSpacing, vSpacing, thickness, centerGap, cellWidth, cellHeight };
}

function poly(ctx, pts, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

function hSeg(x1, x2, y, t){
  return [
    [x1+t/2, y],
    [x2-t/2, y],
    [x2, y+t/2],
    [x2-t/2, y+t],
    [x1+t/2, y+t],
    [x1, y+t/2]
  ];
}

function vSeg(x, y1, y2, t){
  return [
    [x, y1+t/2],
    [x+t/2, y1],
    [x+t, y1+t/2],
    [x+t, y2-t/2],
    [x+t/2, y2],
    [x, y2-t/2]
  ];
}

function dSeg(x1, y1, x2, y2, t){
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const px = -dy / len * (t / 2);
  const py = dx / len * (t / 2);
  return [
    [x1 + px, y1 + py],
    [x1 - px, y1 - py],
    [x2 - px, y2 - py],
    [x2 + px, y2 + py]
  ];
}

function buildSegmentShapes(x, y){
  const metrics = getMetrics();
  const SW = metrics.width;
  const SH = metrics.height;
  const T = metrics.thickness;
  const GAP = metrics.centerGap;
  const MID = SH / 2;
  const left = x;
  const right = x + SW;
  const top = y;
  const bottom = y + SH;
  const innerLeft = left + T;
  const innerRight = right - T;
  const centerX = x + SW / 2;
  const midTop = y + MID - GAP/2;
  const midBottom = y + MID + GAP/2;
  const centerLeft = centerX - GAP/2;
  const centerRight = centerX + GAP/2;
  const centerStemX = centerX - T / 2;
  const middleY = y + MID - T/2;
  const diagInset = 1;

  // Standard 16-segment layout used by the source masks, matching
  // https://raw.githubusercontent.com/dmadison/LED-Segment-ASCII/refs/heads/master/Images/Segment-Labels.png
  //
  //      ---A--- ---B---
  //     | \     |     / |
  //     H   K   M   N   C
  //     |     \ | /     |
  //      ---U--- ---P---
  //     |     / | \     |
  //     G   T   S   R   D
  //     | /     |     \ |
  //      ---F--- ---E---
  //
  // Top: A left, B right
  // Bottom: F left, E right
  // Left side: H upper, G lower
  // Right side: C upper, D lower
  // Middle bars: U left, P right
  // Center stems: M upper, S lower
  // Diagonals: K upper-left, N upper-right, T lower-left, R lower-right
  return {
    A: hSeg(innerLeft, x + SW/2 - GAP/2, top, T),
    B: hSeg(x + SW/2 + GAP/2, innerRight, top, T),
    C: vSeg(right - T, top + T, midTop, T),
    D: vSeg(right - T, midBottom, bottom - T, T),
    E: hSeg(x + SW/2 + GAP/2, innerRight, bottom - T, T),
    F: hSeg(innerLeft, x + SW/2 - GAP/2, bottom - T, T),
    G: vSeg(left, midBottom, bottom - T, T),
    H: vSeg(left, top + T, midTop, T),
    K: dSeg(innerLeft + diagInset, top + T + diagInset, centerLeft + diagInset, midTop - diagInset, T - 1),
    M: vSeg(centerStemX, top + T + 2, midTop - 2, T - 1),
    N: dSeg(centerRight - diagInset, midTop - diagInset, innerRight - diagInset, top + T + diagInset, T - 1),
    P: hSeg(centerRight, innerRight, middleY, T),
    R: dSeg(centerRight - diagInset, midBottom + diagInset, innerRight - diagInset, bottom - T - diagInset, T - 1),
    S: vSeg(centerStemX, midBottom + 2, bottom - T - 2, T - 1),
    T: dSeg(innerLeft + diagInset, bottom - T - diagInset, centerLeft + diagInset, midBottom + diagInset, T - 1),
    U: hSeg(innerLeft, centerLeft, middleY, T)
  };
}

function drawSeg(ctx, shapes, segment, color){
  poly(ctx, shapes[segment], color);
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const secretInput = document.getElementById('secret');
const overridesInput = document.getElementById('overrides');
let lastRenderState = { cells: [] };

function loadStoredMessage(){
  try {
    const stored = localStorage.getItem(STORAGE_KEY_MESSAGE);
    if (stored !== null) secretInput.value = stored;
  } catch (err) {
    // Ignore storage failures so the tool still works in restricted contexts.
  }
}

function loadStoredOverrides(){
  try {
    const stored = localStorage.getItem(STORAGE_KEY_OVERRIDES);
    if (stored !== null) overridesInput.value = stored;
  } catch (err) {
    // Ignore storage failures so the tool still works in restricted contexts.
  }
}

function storeMessage(){
  try {
    localStorage.setItem(STORAGE_KEY_MESSAGE, secretInput.value);
  } catch (err) {
    // Ignore storage failures so the tool still works in restricted contexts.
  }
}

function storeOverrides(){
  try {
    localStorage.setItem(STORAGE_KEY_OVERRIDES, overridesInput.value);
  } catch (err) {
    // Ignore storage failures so the tool still works in restricted contexts.
  }
}

function normalizeOverrideCell(text){
  const set = new Set((text || '').toUpperCase().split('').filter(ch => SEGMENTS.includes(ch)));
  return SEGMENTS.filter(segment => set.has(segment)).join('');
}

function parseOverridesText(text){
  return (text || '').replace(/\r\n?/g, '\n').split('\n').map(
    row => row.split(',').map(cell => normalizeOverrideCell(cell))
  );
}

function serializeOverrides(matrix){
  let lastNonEmptyRow = -1;

  for(let row = 0; row < matrix.length; row++){
    if (matrix[row].some(cell => cell)) lastNonEmptyRow = row;
  }

  if (lastNonEmptyRow === -1) return '';

  const rows = [];
  for(let row = 0; row <= lastNonEmptyRow; row++){
    const cells = (matrix[row] || []).slice();
    let lastNonEmptyCol = -1;
    for(let col = 0; col < cells.length; col++){
      if (cells[col]) lastNonEmptyCol = col;
    }
    rows.push(cells.slice(0, lastNonEmptyCol + 1).join(','));
  }

  return rows.join('\n');
}

function getOverrideMatrix(){
  return parseOverridesText(overridesInput.value);
}

function getOverrideSegments(matrix, row, col){
  return ((matrix[row] || [])[col] || '').split('').filter(Boolean);
}

function setOverrideSegments(row, col, segments){
  const matrix = getOverrideMatrix();
  while (matrix.length <= row) matrix.push([]);
  while (matrix[row].length <= col) matrix[row].push('');
  matrix[row][col] = normalizeOverrideCell(segments.join(''));
  overridesInput.value = serializeOverrides(matrix);
  storeOverrides();
}

function isOverrideMode(){
  return document.getElementById('overrideMode').checked;
}

function pointInPolygon(x, y, points){
  let inside = false;
  for(let i = 0, j = points.length - 1; i < points.length; j = i++){
    const xi = points[i][0];
    const yi = points[i][1];
    const xj = points[j][0];
    const yj = points[j][1];
    const intersects = ((yi > y) !== (yj > y))
      && (x < (xj - xi) * (y - yi) / ((yj - yi) || Number.EPSILON) + xi);
    if (intersects) inside = !inside;
  }
  return inside;
}

function generate(){
  const rawInput = secretInput.value.replace(/\r\n?/g, '\n');
  const raw = isCapsOnlyMode()
    ? rawInput.toUpperCase().replace(/[^A-Z \n]/g,'')
    : rawInput.replace(/[^\x20-\x7E\n]/g,'');
  const mode = document.getElementById('decoy').value;
  const metrics = getMetrics();
  const lines = (raw || 'HELLO').split('\n');
  const overrideMatrix = getOverrideMatrix();
  const rowCount = Math.max(1, lines.length, overrideMatrix.length);
  const maxCols = Math.max(
    1,
    ...lines.map(line => line.length),
    ...overrideMatrix.map(row => row.length)
  );

  canvas.width  = PAD * 2 + maxCols * metrics.width + Math.max(0, maxCols - 1) * metrics.hSpacing;
  canvas.height = PAD * 2 + rowCount * metrics.height + Math.max(0, rowCount - 1) * metrics.vSpacing;
  // Leave the canvas transparent so downloaded PNGs preserve transparency.
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  lastRenderState = { cells: [], rowCount, colCount: maxCols };

  for(let row = 0; row < rowCount; row++){
    const chars = (lines[row] || '').split('');
    const rowTop = PAD + row * metrics.cellHeight;
    lastRenderState.cells[row] = [];

    for(let i=0; i<maxCols; i++){
      const ch = chars[i] || ' ';
      const sx = PAD + i * metrics.cellWidth;
      const sy = rowTop;
      const shapes = buildSegmentShapes(sx, sy);
      const sec = S[ch] || S[' '];
      const overrideSegments = getOverrideSegments(overrideMatrix, row, i);
      const decoyChar = pickDecoy(mode, ch);
      const dec = decoyChar === '*' ? FULL_MASK : (S[decoyChar] || S[' ']);
      const visibleSet = new Set([...sec, ...overrideSegments]);
      lastRenderState.cells[row][i] = { x: sx, y: sy, shapes };

      // Draw decoys first so the real message can overwrite any overlapping
      // segments with the cyan-like "visible through red filter" color.
      for(const segment of dec){
        if(!visibleSet.has(segment)){
          drawSeg(ctx, shapes, segment, decoyCoverColor());
        }
      }

      for(const segment of visibleSet){
        drawSeg(ctx, shapes, segment, hiddenMessageColor());
      }
    }
  }
}

let filterOn = false;
document.getElementById('genBtn').onclick = generate;
document.getElementById('filtBtn').onclick = function(){
  filterOn = !filterOn;
  this.classList.toggle('on', filterOn);
  document.getElementById('filterOverlay').classList.toggle('on', filterOn);
};
document.getElementById('dlBtn').onclick = ()=>{
  const a=document.createElement('a');
  a.download='hidden_message.png'; a.href=canvas.toDataURL(); a.click();
};
secretInput.oninput = ()=>{
  storeMessage();
  generate();
};
overridesInput.oninput = ()=>{
  storeOverrides();
  generate();
};
document.getElementById('decoy').onchange = generate;
document.getElementById('charHeight').oninput = generate;
document.getElementById('charWidth').oninput = generate;
document.getElementById('hSpacing').oninput = generate;
document.getElementById('vSpacing').oninput = generate;
document.getElementById('lineThickness').oninput = generate;
document.getElementById('capsOnly').onchange = generate;
document.getElementById('overrideMode').onchange = ()=>{
  canvas.style.cursor = isOverrideMode() ? 'crosshair' : 'default';
};
canvas.onclick = (event)=>{
  if (!isOverrideMode()) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (event.clientX - rect.left) * scaleX;
  const y = (event.clientY - rect.top) * scaleY;

  for(let row = 0; row < lastRenderState.cells.length; row++){
    for(let col = 0; col < lastRenderState.cells[row].length; col++){
      const cell = lastRenderState.cells[row][col];
      if (!cell) continue;

      for(const segment of SEGMENTS){
        if (pointInPolygon(x, y, cell.shapes[segment])) {
          const current = new Set(getOverrideSegments(getOverrideMatrix(), row, col));
          if (current.has(segment)) current.delete(segment);
          else current.add(segment);
          setOverrideSegments(row, col, [...current]);
          generate();
          return;
        }
      }
    }
  }
};
loadStoredMessage();
loadStoredOverrides();
canvas.style.cursor = isOverrideMode() ? 'crosshair' : 'default';
generate();
</script>
