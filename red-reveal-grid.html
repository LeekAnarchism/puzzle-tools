<style>
  .wrap { padding: 1.5rem 0; font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; margin-bottom: 0.75rem; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
  .field.compact { flex: 0 1 140px; min-width: 120px; }
  label { font-size: 13px; color: var(--color-text-secondary); }
  .hint { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
  textarea {
    min-height: 8rem;
    resize: vertical;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 18px;
    line-height: 1.2;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #b9b9b9;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 14px;
    color: #222;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
  }
  .btn:hover { background: #eeeeee; }
  .btn:active { background: #e4e4e4; }
  .btn.on { background: #e6e6e6; border-color: #999; color: #111; }
  h3 { font-size: 15px; font-weight: 500; margin: 0 0 0.75rem; color: var(--color-text-primary); }
  .canvas-wrap {
    position: relative;
    display: inline-block;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
    overflow: hidden;
    background: #fff;
  }
  #filterOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: hsl(0,100%,50%);
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  #filterOverlay.on { display: block; }
</style>

<div class="wrap">
  <h2 class="sr-only">Red reveal grid</h2>
  <h3>Red reveal grid</h3>

  <div class="row">
    <div class="field">
      <label for="message">Grid text</label>
      <textarea id="message" rows="6" maxlength="600">RED REVEAL
GRID TOOL</textarea>
      <span class="hint">Text is drawn in black Comic Sans inside the colored grid.</span>
    </div>
  </div>

  <div class="row">
    <div class="field compact">
      <label for="gridWidth">Grid width</label>
      <input type="number" id="gridWidth" min="1" max="80" step="1" value="12">
    </div>
    <div class="field compact">
      <label for="gridHeight">Grid height</label>
      <input type="number" id="gridHeight" min="1" max="80" step="1" value="8">
    </div>
    <div class="field compact">
      <label for="cellSize">Cell size (pixels)</label>
      <input type="number" id="cellSize" min="12" max="120" step="1" value="36">
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="genBtn">Generate</button>
    <button class="btn" id="filtBtn">Toggle red filter</button>
    <button class="btn" id="dlBtn">Download PNG</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="filterOverlay"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'red-reveal-grid.state';
const PAD = 0;
const DEFAULTS = {
  message: 'RED REVEAL\nGRID TOOL',
  gridWidth: '12',
  gridHeight: '8',
  cellSize: '36',
  hiddenCells: []
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const messageInput = document.getElementById('message');
const gridWidthInput = document.getElementById('gridWidth');
const gridHeightInput = document.getElementById('gridHeight');
const cellSizeInput = document.getElementById('cellSize');

let hiddenCells = new Set();
let filterOn = false;
let renderState = { width: 0, height: 0, cellSize: 0 };

function clampNumber(value, min, max, fallback) {
  const num = Number.parseInt(value, 10);
  if (Number.isNaN(num)) return fallback;
  return Math.min(max, Math.max(min, num));
}

function keyForCell(row, col) {
  return `${row},${col}`;
}

function parseHiddenCells(items) {
  if (!Array.isArray(items)) return new Set();
  return new Set(
    items.filter(item => typeof item === 'string' && /^\d+,\d+$/.test(item))
  );
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    messageInput.value = typeof state.message === 'string' ? state.message : DEFAULTS.message;
    gridWidthInput.value = typeof state.gridWidth === 'string' ? state.gridWidth : DEFAULTS.gridWidth;
    gridHeightInput.value = typeof state.gridHeight === 'string' ? state.gridHeight : DEFAULTS.gridHeight;
    cellSizeInput.value = typeof state.cellSize === 'string' ? state.cellSize : DEFAULTS.cellSize;
    hiddenCells = parseHiddenCells(state.hiddenCells);
  } catch (err) {
    hiddenCells = new Set();
  }
}

function storeState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      message: messageInput.value,
      gridWidth: gridWidthInput.value,
      gridHeight: gridHeightInput.value,
      cellSize: cellSizeInput.value,
      hiddenCells: [...hiddenCells].sort()
    }));
  } catch (err) {
    // Ignore storage failures.
  }
}

function revealColor() {
  const g = 140 + Math.floor(Math.random() * 116);
  const b = 120 + Math.floor(Math.random() * 136);
  const r = Math.floor(Math.random() * 60);
  return `rgb(${r},${g},${b})`;
}

function hiddenColor() {
  const r = Math.floor(Math.random() * 256);
  const g = Math.floor(Math.random() * 90);
  const b = Math.floor(Math.random() * 90);
  return `rgb(${r},${g},${b})`;
}

function trimHiddenCells(width, height) {
  hiddenCells = new Set(
    [...hiddenCells].filter(key => {
      const [row, col] = key.split(',').map(Number);
      return row < height && col < width;
    })
  );
}

function getMetrics() {
  const width = clampNumber(gridWidthInput.value, 1, 80, 12);
  const height = clampNumber(gridHeightInput.value, 1, 80, 8);
  const cellSize = clampNumber(cellSizeInput.value, 12, 120, 36);
  return { width, height, cellSize };
}

function drawGrid(width, height, cellSize) {
  for (let row = 0; row < height; row++) {
    for (let col = 0; col < width; col++) {
      const x = PAD + col * cellSize;
      const y = PAD + row * cellSize;
      const color = hiddenCells.has(keyForCell(row, col)) ? hiddenColor() : revealColor();
      ctx.fillStyle = color;
      ctx.fillRect(x, y, cellSize, cellSize);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cellSize - 1, cellSize - 1);
    }
  }
}

function drawText(width, height, cellSize) {
  ctx.fillStyle = '#000';
  ctx.font = `${Math.max(12, Math.floor(cellSize * 0.72))}px "Comic Sans MS", "Comic Sans", cursive`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  const normalized = messageInput.value.replace(/\r\n?/g, '\n');
  const lines = normalized.split('\n');

  for (let row = 0; row < Math.min(lines.length, height); row++) {
    const chars = lines[row].split('');
    for (let col = 0; col < Math.min(chars.length, width); col++) {
      const x = PAD + col * cellSize + cellSize / 2;
      const y = PAD + row * cellSize + cellSize / 2;
      ctx.fillText(chars[col], x, y);
    }
  }
}

function generate() {
  const { width, height, cellSize } = getMetrics();
  trimHiddenCells(width, height);
  canvas.width = PAD * 2 + width * cellSize;
  canvas.height = PAD * 2 + height * cellSize;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid(width, height, cellSize);
  drawText(width, height, cellSize);
  renderState = { width, height, cellSize };
  storeState();
}

document.getElementById('genBtn').onclick = generate;
document.getElementById('filtBtn').onclick = function(){
  filterOn = !filterOn;
  this.classList.toggle('on', filterOn);
  document.getElementById('filterOverlay').classList.toggle('on', filterOn);
};
document.getElementById('dlBtn').onclick = ()=>{
  const a = document.createElement('a');
  a.download = 'red_reveal_grid.png';
  a.href = canvas.toDataURL();
  a.click();
};

messageInput.oninput = generate;
gridWidthInput.oninput = generate;
gridHeightInput.oninput = generate;
cellSizeInput.oninput = generate;

canvas.onclick = (event) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (event.clientX - rect.left) * scaleX;
  const y = (event.clientY - rect.top) * scaleY;
  const col = Math.floor((x - PAD) / renderState.cellSize);
  const row = Math.floor((y - PAD) / renderState.cellSize);

  if (row < 0 || col < 0 || row >= renderState.height || col >= renderState.width) return;

  const key = keyForCell(row, col);
  if (hiddenCells.has(key)) hiddenCells.delete(key);
  else hiddenCells.add(key);
  generate();
};

loadState();
generate();
</script>
